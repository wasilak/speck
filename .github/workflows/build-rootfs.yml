name: Build speck rootfs image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Rootfs version (e.g. 0.1.0)
        required: true
        default: "1.3.0"
      backend:
        description: Runtime backend to install in rootfs
        required: false
        default: "moby"
        type: choice
        options:
          - moby
  push:
    tags: ["rootfs-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#rootfs-v}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=moby" >> "$GITHUB_OUTPUT"
          echo "release_tag=rootfs-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create raw ext4 image (512 MB)
        run: |
          dd if=/dev/zero of=rootfs.img bs=1M count=512
          mkfs.ext4 -O dir_index,extent -L speck-rootfs rootfs.img

      - name: Mount and populate rootfs (moby)
        run: |
          mkdir -p /tmp/rootfs
          sudo mount -o loop rootfs.img /tmp/rootfs

          # Alpine aarch64 minirootfs as the userspace base
          curl -fsSL \
            "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz" \
            | sudo tar -C /tmp/rootfs -xz

          echo "nameserver 1.1.1.1" | sudo tee /tmp/rootfs/etc/resolv.conf

          sudo mount -t proc proc /tmp/rootfs/proc
          sudo mount -t sysfs sysfs /tmp/rootfs/sys
          sudo mount --bind /dev /tmp/rootfs/dev

          # Install Docker Engine (moby) from Alpine community repo.
          # docker package brings: dockerd, docker-proxy, containerd, runc.
          # No iptables needed — speck-net re-originates all TCP from the host.
          sudo chroot /tmp/rootfs /bin/sh -c "
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.20/community' >> /etc/apk/repositories
            apk update
            apk add --no-cache \
              docker \
              ca-certificates \
              iproute2
          "

          sudo mkdir -p /tmp/rootfs/run/speck
          sudo mkdir -p /tmp/rootfs/var/lib/containerd

          sudo umount /tmp/rootfs/dev
          sudo umount /tmp/rootfs/sys
          sudo umount /tmp/rootfs/proc

          echo "=== moby binary inventory ==="
          for p in \
            usr/bin/dockerd \
            usr/bin/docker-proxy \
            usr/bin/containerd \
            usr/bin/runc; do
            f="/tmp/rootfs/${p}"
            [ -e "$f" ] && echo "FOUND: /${p}" || echo "MISSING: /${p}"
          done

          sudo umount /tmp/rootfs

      - name: Compress and compute checksum
        run: |
          BACKEND="${{ steps.meta.outputs.backend }}"
          VERSION="${{ steps.meta.outputs.version }}"
          gzip -9 -c rootfs.img > "speck-rootfs-${VERSION}-${BACKEND}-arm64.img.gz"
          shasum -a 256 rootfs.img > "speck-rootfs-${VERSION}-${BACKEND}-arm64.img.sha256"

      - name: Upload as GitHub Release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: |
            speck-rootfs-*.img.gz
            speck-rootfs-*.img.sha256
