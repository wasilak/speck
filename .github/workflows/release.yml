name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + ability to push Formula update back to main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --package speck-cli --target aarch64-apple-darwin

      - name: Codesign (ad-hoc, embeds virtualization entitlement)
        run: |
          codesign --sign - \
            --entitlements speck.entitlements \
            --force \
            target/aarch64-apple-darwin/release/spk
          codesign --verify --verbose target/aarch64-apple-darwin/release/spk

      - name: Create release archive
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          tar -czf "spk-${VERSION}-aarch64-apple-darwin.tar.gz" \
            -C target/aarch64-apple-darwin/release spk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release create "v${VERSION}" --generate-notes \
            "spk-${VERSION}-aarch64-apple-darwin.tar.gz"

      - name: Update Formula SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SHA=$(shasum -a 256 "spk-${VERSION}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          echo "SHA256: ${SHA}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git checkout main
          sed -i '' \
            -e "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            -e "s|version \".*\"|version \"${VERSION}\"|" \
            Formula/speck.rb
          git add Formula/speck.rb
          git diff --staged --quiet || git commit -m "chore: update Formula to v${VERSION}"
          git push origin main
