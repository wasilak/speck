name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install protoc
        run: brew install protobuf

      - name: Build ad-hoc development distribution artifacts
        run: cargo xtask dist

      - name: List release artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          test -f "dist/spk-development-non-notarized.pkg"
          test -f "dist/spk-${VERSION}-aarch64-apple-darwin-development-non-notarized.tar.gz"
          ls -la dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release create "v${VERSION}" --generate-notes \
            "dist/spk-development-non-notarized.pkg" \
            "dist/spk-${VERSION}-aarch64-apple-darwin-development-non-notarized.tar.gz" \
            "dist/DEVELOPMENT-NON-NOTARIZED.txt"
