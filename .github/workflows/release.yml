name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --package speck-cli --target aarch64-apple-darwin

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/build.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/build.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Codesign with Developer ID and hardened runtime
        run: |
          codesign \
            --sign "Developer ID Application: ${{ secrets.DEVELOPER_ID_NAME }}" \
            --entitlements speck.entitlements \
            --options runtime \
            --force \
            target/aarch64-apple-darwin/release/spk
          codesign --verify --verbose target/aarch64-apple-darwin/release/spk

      - name: Prepare for notarization
        run: |
          ditto -c -k --keepParent \
            target/aarch64-apple-darwin/release/spk \
            spk.zip

      - name: Notarize
        env:
          AUTH_KEY_P8: ${{ secrets.AUTH_KEY_P8 }}
          AUTH_KEY_ID: ${{ secrets.AUTH_KEY_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}
        run: |
          echo "$AUTH_KEY_P8" > auth_key.p8
          xcrun notarytool submit spk.zip \
            --key auth_key.p8 \
            --key-id "$AUTH_KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple target/aarch64-apple-darwin/release/spk
          codesign --verify --verbose target/aarch64-apple-darwin/release/spk

      - name: Create release archive
        run: |
          tar -czf speck-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz \
            -C target/aarch64-apple-darwin/release spk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: speck-${{ github.ref_name }}-aarch64-apple-darwin
          path: speck-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: speck-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          generate_release_notes: true
