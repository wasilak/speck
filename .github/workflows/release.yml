name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "changes<<EOF" >> "$GITHUB_OUTPUT"
            git log --oneline --no-decorate "$PREV_TAG..HEAD" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changes=Initial release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Changes since last release

            ${{ steps.notes.outputs.changes }}

            ## Notes

            This is an Apple Silicon (`aarch64-apple-darwin`) only release. The signed binary requires `com.apple.security.virtualization` entitlement and must be built locally with an Apple Developer ID certificate for production use.

            For development ad-hoc signing: `cargo xtask codesign-dev`
