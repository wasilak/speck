name: CI

on:
  push:
    branches: [main]
  pull_request:

# Docker API Conformance Tests (DOCKER-05)
# These tests require a signed binary and a running 'spk up' session.
# To run conformance tests manually:
#   1. Run: cargo xtask codesign-dev
#   2. Run: spk up  (in a separate terminal)
#   3. Run: cargo test -p speck-dockerd --test api_conformance -- --include-ignored
#   4. Run: cargo test -p speck-vz --test integration_06 -- --include-ignored
# These tests are NOT run in automated CI due to the codesigning requirement.
# See DIST-01, DIST-02 for the signing prerequisites.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Only speck-guest compiles on Linux — all other crates either require
      # the macOS SDK (objc2, Virtualization.framework) or have an explicit
      # compile_error! guard (speck-core). Full workspace clippy needs a
      # macOS runner (TODO: add macos-latest job).
      - name: cargo clippy
        run: cargo clippy -p speck-guest --all-targets --target x86_64-unknown-linux-gnu -- -Dwarnings

      - name: No-print lint (hard gate)
        run: |
          if rg --type rust '(print!|println!|eprint!|eprintln!)\s*\(' crates/speck-core/src/; then
            echo "FAIL: print macros found in speck-core. Use the EventSink trait instead."
            exit 1
          fi
          echo "OK: no print macros in speck-core"

      # Only speck-guest compiles on Linux: all other crates either require
      # macOS SDK (objc2, Virtualization.framework, system-configuration) or
      # have an explicit compile_error! guard (speck-core). speck-guest is
      # the Linux vminitd binary and has no macOS dependencies.
      - name: cargo test
        run: cargo test --target x86_64-unknown-linux-gnu -p speck-guest
