[workspace]
resolver = "2"
members = [
    "crates/speck-core",
    "crates/speck-cli",
    "crates/speck-vz",
    "crates/speck-dockerd",
    "crates/speck-guest",
    "crates/speck-net",
    "xtask",
]

[workspace.package]
version = "1.5.3"
edition = "2024"
license = "AGPL-3.0-only"

[profile.release]
strip = true
lto = true
codegen-units = 1
