[package]
name = "speck-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
speck-core = { path = "../speck-core" }
tokio = { version = "1.52", features = ["rt", "net", "io-util", "sync", "fs", "time"] }
socket2 = "0.5"
libc = "0.2"
thiserror = "2"
smoltcp = "0.13.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
system-configuration = "0.7.0"
system-configuration-sys = "0.6.0"
core-foundation = "0.10.1"
dispatch2 = "0.3.1"

[dev-dependencies]
serde_json = "1"
