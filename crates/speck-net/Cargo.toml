[package]
name = "speck-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
speck-core = { path = "../speck-core" }
tokio = { version = "1.52", features = ["rt", "net", "io-util", "sync", "fs", "time"] }
socket2 = "0.5"
libc = "0.2"
thiserror = "2"
# Default features minus "auto-icmp-echo-reply": with any_ip that feature
# answers pings to every destination locally, so container ping health checks
# lied (EGRESS-06). Guest ICMP is now simply not forwarded.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "std", "log", "medium-ethernet", "medium-ip", "medium-ieee802154",
    "phy-raw_socket", "phy-tuntap_interface", "proto-ipv4", "proto-dhcpv4",
    "proto-ipv6", "proto-ipv6-slaac", "proto-dns", "proto-ipv4-fragmentation",
    "proto-sixlowpan-fragmentation", "socket-raw", "socket-icmp", "socket-udp",
    "socket-tcp", "socket-dhcpv4", "socket-dns", "socket-mdns", "packetmeta-id",
    "async", "multicast",
] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
system-configuration = "0.7.0"
system-configuration-sys = "0.6.0"
core-foundation = "0.10.1"
dispatch2 = "0.3.1"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
serde_json = "1"
mockall = "0.15.0"
