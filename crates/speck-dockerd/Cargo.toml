[package]
name = "speck-dockerd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
axum = "0.8.9"
http-body-util = "0.1"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "client-legacy", "tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speck-core = { path = "../speck-core" }
speck-vz = { path = "../speck-vz" }
thiserror = "2"
tokio = { version = "1.52.3", features = ["full", "net"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"

[dev-dependencies]
bollard = "0.21.0"
futures-util = "0.3"
tokio-test = "0.4"
